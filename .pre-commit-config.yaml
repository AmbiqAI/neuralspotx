repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.7.2
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      # Runs the project-pinned ty (see [dependency-groups].lint in
      # pyproject.toml) so pre-commit and CI check with the same version.
      - id: ty
        name: ty type check
        entry: uv run --no-sync ty check src/neuralspotx tests
        language: system
        pass_filenames: false
        types: [python]
