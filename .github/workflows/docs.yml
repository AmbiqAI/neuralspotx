name: Docs site

# Build and validate the Astro site only. The MkDocs site in deploy-pages.yml
# is still the published one, so nothing here needs Pages permissions, an
# environment or a secret. Deploy arrives with the cutover
# (AmbiqAI/neuralspotx#261).

on:
  push:
    branches:
      - main
    paths:
      - "astro-site/**"
      - "docs/**"
      - "scripts/docs/**"
      - "src/neuralspotx/**"
      - ".github/workflows/docs.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "astro-site/**"
      - "docs/**"
      - "scripts/docs/**"
      - "src/neuralspotx/**"
      - ".github/workflows/docs.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The pull_request checkout is a merge commit that exists on no branch,
      # so the footer's provenance link has to name the head commit instead.
      DOCS_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: astro-site/.nvmrc
          cache: npm
          cache-dependency-path: astro-site/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install locked site dependencies
        working-directory: astro-site
        run: npm ci

      # The reference is generated from the installed package, so the Python
      # environment has to exist before anything under astro-site runs.
      - name: Install the package and its test dependencies
        run: uv sync --group test

      # Generated explicitly, and timed, so the job summary records how long
      # extraction takes independently of the Astro build that follows it.
      # build-reference.mjs appends its own per-stage table to the summary.
      - name: Generate the reference
        id: reference
        working-directory: astro-site
        run: |
          start=$(date +%s)
          npm run build:reference
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - name: Check reference completeness
        run: uv run --group test pytest tests/test_reference_generation.py tests/test_public_surface_doc.py -q

      - name: Astro check
        working-directory: astro-site
        run: npm run check
        env:
          NSX_DOCS_REFERENCE_PREBUILT: '1'

      - name: Build the site
        id: build
        working-directory: astro-site
        run: |
          start=$(date +%s)
          npm run build
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
        env:
          NSX_DOCS_REFERENCE_PREBUILT: '1'

      - name: Validate the built site
        working-directory: astro-site
        run: npm run validate

      - name: Summarize the build
        if: always()
        working-directory: astro-site
        run: |
          {
            echo "### Docs site"
            echo
            echo "| Measure | Value |"
            echo "| --- | --- |"
            echo "| Reference generation | ${REFERENCE_SECONDS:-n/a}s |"
            echo "| Build time | ${BUILD_SECONDS:-n/a}s |"
            echo "| HTML pages | $(find dist -name '*.html' 2>/dev/null | wc -l | tr -d ' ') |"
            echo "| Artifact size | $(du -sh dist 2>/dev/null | cut -f1) |"
            echo "| helia-ui | $(node -p "require('./package.json').dependencies['@ambiqai/helia-ui']") |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BUILD_SECONDS: ${{ steps.build.outputs.seconds }}
          REFERENCE_SECONDS: ${{ steps.reference.outputs.seconds }}

      - name: Upload the built site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neuralspotx-docs-site
          path: astro-site/dist/
          if-no-files-found: error
          retention-days: 14
