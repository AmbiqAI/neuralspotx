name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild; leave empty to update the release PR
        required: false
        type: string

permissions: {}

defaults:
  run:
    shell: bash

# Release Please mutation, tag creation, and publication must never run
# concurrently with themselves: serialize every invocation of this workflow
# (push-triggered and manual rebuilds alike) so overlapping runs cannot race
# on the release PR branch, an in-flight tag, or a publish step.
#
# `queue: max` matters here as much as `cancel-in-progress: false` does: the
# default `queue: single` would silently cancel an already-*pending* run (for
# example, a release-landing push waiting behind exact-commit-ci) the moment
# a second push queues behind it, dropping that release with no error. `max`
# lets pending runs queue up (FIFO) instead of displacing each other.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  release-please:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.tag == '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release-metadata.outputs.release_created }}
      tag_name: ${{ steps.release-metadata.outputs.tag_name }}
      body: ${{ steps.release-metadata.outputs.body }}
      pr: ${{ steps.release.outputs.pr }}

    steps:
      - name: Checkout release landing commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Derive release metadata from the landing commit
        id: release-metadata
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          current_text = Path("pyproject.toml").read_text(encoding="utf-8")
          current_version = tomllib.loads(current_text)["project"]["version"]
          tag_name = f"neuralspotx-v{current_version}"

          # Whether this push is landing a *new* release must not depend on
          # how many commits the merged release PR contained or which
          # GitHub merge method (merge commit, squash, or rebase) landed
          # it -- diffing pyproject.toml against HEAD^ broke that
          # invariant once the release PR could carry a second commit (the
          # uv.lock sync). Tag existence is agnostic to both.
          #
          # Fail closed on anything other than a clean 404: an auth,
          # rate-limit, or network failure here must not be silently
          # treated as "tag does not exist" (which would then try to
          # re-tag/re-publish an already-released version downstream).
          tag_check = subprocess.run(
              ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/tags/{tag_name}"],
              capture_output=True,
              text=True,
          )
          if tag_check.returncode == 0:
              tag_exists = True
          elif "HTTP 404" in tag_check.stderr:
              tag_exists = False
          else:
              raise SystemExit(
                  f"Could not determine whether {tag_name} exists "
                  f"(gh api exited {tag_check.returncode}): {tag_check.stderr.strip()}"
              )

          if tag_exists:
              print("release_created=false")
              print("tag_name=")
              print("body<<RELEASE_NOTES")
              print("")
              print("RELEASE_NOTES")
              raise SystemExit

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(
              rf"^## \[{re.escape(current_version)}\].*$", re.MULTILINE
          ).search(changelog)
          if heading is None:
              raise SystemExit(
                  f"CHANGELOG.md has no release section for {current_version}."
              )
          next_heading = re.compile(r"^## \[", re.MULTILINE).search(
              changelog, heading.end()
          )
          body = changelog[heading.start() : next_heading.start() if next_heading else None]

          print("release_created=true")
          print(f"tag_name={tag_name}")
          print("body<<RELEASE_NOTES")
          print(body.strip())
          print("RELEASE_NOTES")
          PY

  sync-release-lock:
    needs: release-please
    if: ${{ needs.release-please.result == 'success' && needs.release-please.outputs.pr != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      branch: ${{ steps.push.outputs.branch }}
      head_sha: ${{ steps.push.outputs.head_sha }}
      changed: ${{ steps.push.outputs.changed }}
    steps:
      - name: Checkout release landing commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate release PR branch and fetch its head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ needs.release-please.outputs.pr }}
        run: |
          set -euo pipefail

          # The release PR branch/component naming is a release-please
          # convention (release-please--branches--<target>--components--<pkg>).
          # Pin it to this repository's own config instead of trusting the
          # action output string outright, so a spoofed or unexpected branch
          # name fails closed rather than being checked out and pushed to.
          package_name=$(jq -r '.packages["."]["package-name"]' release-please-config.json)
          expected_branch="release-please--branches--main--components--${package_name}"

          number=$(printf '%s' "$PR_JSON" | jq -r '.number')
          branch=$(printf '%s' "$PR_JSON" | jq -r '.headBranchName')

          if [[ ! "$number" =~ ^[0-9]+$ ]]; then
            echo "Release Please did not report a numeric PR number." >&2
            exit 1
          fi
          if [[ "$branch" != "$expected_branch" ]]; then
            echo "Unexpected release PR branch name: $branch (expected $expected_branch)." >&2
            exit 1
          fi

          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$number")
          state=$(printf '%s' "$pr" | jq -r '.state')
          head_ref=$(printf '%s' "$pr" | jq -r '.head.ref')
          head_repo=$(printf '%s' "$pr" | jq -r '.head.repo.full_name // empty')
          base_repo=$(printf '%s' "$pr" | jq -r '.base.repo.full_name // empty')
          head_sha=$(printf '%s' "$pr" | jq -r '.head.sha')

          # Refuse anything that is not this exact bot-owned, same-repo,
          # open release branch: never push to a fork or an unrelated PR.
          if [[ "$state" != "open" ]]; then
            echo "Release PR #$number is not open." >&2
            exit 1
          fi
          if [[ "$head_ref" != "$branch" ]]; then
            echo "Release PR head ref ($head_ref) does not match reported branch ($branch)." >&2
            exit 1
          fi
          if [[ "$head_repo" != "$GITHUB_REPOSITORY" || "$base_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "Release PR is not entirely within $GITHUB_REPOSITORY; refusing to push." >&2
            exit 1
          fi
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release PR head is not a full commit SHA: $head_sha" >&2
            exit 1
          fi

          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout the validated release PR branch
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          actual_sha=$(git rev-parse FETCH_HEAD)
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Fetched branch head ($actual_sha) does not match the validated PR head ($EXPECTED_SHA)." >&2
            exit 1
          fi
          git checkout -B "$BRANCH" FETCH_HEAD

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Regenerate uv.lock for the bumped version
        run: |
          set -euo pipefail
          version=$(python3 -c '
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          ')
          echo "Locking neuralspotx $version"
          # Canonical dependency-resolution command (not a regex edit of
          # uv.lock) so the editable package version and any other lock
          # metadata that depends on it stay coherent.
          uv lock

      - name: Commit and push uv.lock if it changed
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail

          if git diff --quiet -- uv.lock; then
            echo "uv.lock already matches pyproject.toml; nothing to push."
            printf 'branch=%s\n' "$BRANCH" >> "$GITHUB_OUTPUT"
            printf 'head_sha=%s\n' "$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=$(git status --porcelain=v1 -- . | awk '{print $2}')
          if [[ "$changed_files" != "uv.lock" ]]; then
            echo "Refusing to push: expected only uv.lock to change, got: $changed_files" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit --message "chore: sync uv.lock for the release-please branch"

          # Plain, non-force push to the exact bot-owned branch validated
          # above. This uses the job's GITHUB_TOKEN (not a PAT), so the push
          # itself will not trigger other workflows -- CI is dispatched
          # explicitly in the next job against this new commit.
          if ! git push origin "HEAD:refs/heads/$BRANCH"; then
            echo "Direct push to $BRANCH was rejected (branch protection?)." >&2
            echo "Falling back to a single-file commit via the GitHub Contents API." >&2

            # Fail fast, with a clear error, if the branch moved since we
            # validated it -- rather than relying solely on the Contents
            # API's blob-sha conflict check below to reject a stale write.
            remote_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$BRANCH" --jq '.object.sha')
            if [[ "$remote_sha" != "$EXPECTED_SHA" ]]; then
              echo "Branch $BRANCH is now at $remote_sha, not the validated head $EXPECTED_SHA; aborting." >&2
              exit 1
            fi

            # uv.lock can exceed the ~128 KiB single-argument limit that
            # execve enforces on Linux runners, so the base64 payload is
            # written to a file and passed with gh's "@file" field syntax
            # instead of being interpolated into the command line.
            lock_b64_path="${RUNNER_TEMP}/uv.lock.b64"
            base64 < uv.lock | tr -d '\n' > "$lock_b64_path"
            existing_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/uv.lock?ref=$BRANCH" --jq '.sha')
            api_commit=$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/uv.lock" \
              --field "message=chore: sync uv.lock for the release-please branch" \
              --field "content=@${lock_b64_path}" \
              --field "sha=$existing_sha" \
              --field "branch=$BRANCH")
            new_sha=$(printf '%s' "$api_commit" | jq -r '.commit.sha')
          else
            new_sha=$(git rev-parse HEAD)
          fi

          if [[ ! "$new_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Did not obtain a commit SHA for the pushed uv.lock update." >&2
            exit 1
          fi

          printf 'branch=%s\n' "$BRANCH" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$new_sha" >> "$GITHUB_OUTPUT"
          printf 'changed=true\n' >> "$GITHUB_OUTPUT"

  dispatch-release-pr-ci:
    needs: sync-release-lock
    if: ${{ needs.sync-release-lock.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # GITHUB_TOKEN-created PRs and GITHUB_TOKEN pushes do not trigger other
      # workflows. Dispatch CI explicitly, and only now -- after the uv.lock
      # sync job has landed its commit (or confirmed none was needed) -- so
      # the required status check runs against the final branch head rather
      # than the earlier, pre-sync Release Please commit.
      - name: Confirm the branch still points at the synced head
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.sync-release-lock.outputs.branch }}
          EXPECTED_SHA: ${{ needs.sync-release-lock.outputs.head_sha }}
        run: |
          set -euo pipefail
          remote_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$BRANCH" --jq '.object.sha')
          if [[ "$remote_sha" != "$EXPECTED_SHA" ]]; then
            echo "Branch $BRANCH moved to $remote_sha after uv.lock sync recorded $EXPECTED_SHA." >&2
            exit 1
          fi

      - name: Dispatch CI on the release-please PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.sync-release-lock.outputs.branch }}
        run: |
          set -euo pipefail
          echo "Dispatching CI on branch: $BRANCH"
          gh workflow run ci.yml --ref "$BRANCH" --repo "$GITHUB_REPOSITORY"

  release-context:
    needs: release-please
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.tag != '') || (needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.context.outputs.release_tag }}
      target_sha: ${{ steps.context.outputs.target_sha }}
      manual: ${{ steps.context.outputs.manual }}

    steps:
      - name: Checkout release target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Resolve release target
        id: context
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_PLEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          LANDING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_TAG" ]]; then
            release_tag="$INPUT_TAG"
            if [[ ! "$release_tag" =~ ^(v|neuralspotx-v)[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Manual rebuilds must target an existing version tag." >&2
              exit 1
            fi
            target_sha=$(git rev-parse "refs/tags/$release_tag^{commit}")
            manual=true
          else
            release_tag="$RELEASE_PLEASE_TAG"
            target_sha="$LANDING_SHA"
            manual=false
          fi

          if [[ -z "$release_tag" ]]; then
            echo "Release Please did not provide a release tag." >&2
            exit 1
          fi
          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release target is not a full commit SHA: $target_sha" >&2
            exit 1
          fi

          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'target_sha=%s\n' "$target_sha" >> "$GITHUB_OUTPUT"
          printf 'manual=%s\n' "$manual" >> "$GITHUB_OUTPUT"

  exact-commit-ci:
    needs: release-context
    # `release-please` is intentionally skipped for a tagged manual rebuild.
    # release-context overrides that skipped ancestor with `always()`; this job
    # must do the same or GitHub propagates the ancestor skip through the rest
    # of the rebuild graph even though release-context completed successfully.
    if: ${{ always() && needs.release-context.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    outputs:
      run_id: ${{ steps.ci.outputs.run_id }}

    steps:
      - name: Dispatch and await exact-commit CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.release-context.outputs.target_sha }}
          CI_BRANCH: release-ci-${{ github.run_id }}
        run: |
          set -euo pipefail

          workflow_runs="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs"
          before_ids=$(gh api "$workflow_runs?event=workflow_dispatch&head_sha=$TARGET_SHA&per_page=100" --jq '[.workflow_runs[].id]')
          ref="refs/heads/$CI_BRANCH"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            --field "ref=$ref" \
            --field "sha=$TARGET_SHA" >/dev/null
          cleanup() {
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$CI_BRANCH" >/dev/null
          }
          trap cleanup EXIT
          gh workflow run ci.yml --ref "$CI_BRANCH" --repo "$GITHUB_REPOSITORY"

          run_id=""
          for _ in {1..60}; do
            run_id=$(gh api "$workflow_runs?event=workflow_dispatch&head_sha=$TARGET_SHA&per_page=100" |
              jq -r --argjson before "$before_ids" '
                [.workflow_runs[]
                 | select(.id as $id | ($before | index($id)) == null)]
                | sort_by(.created_at)
                | last
                | .id // empty')
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$run_id" ]]; then
            echo "No fresh CI run appeared for exact commit $TARGET_SHA." >&2
            exit 1
          fi

          for _ in {1..120}; do
            run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id")
            status=$(printf '%s' "$run" | jq -r '.status')
            conclusion=$(printf '%s' "$run" | jq -r '.conclusion // empty')
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" != "success" ]]; then
                echo "Exact-commit CI concluded $conclusion for $TARGET_SHA." >&2
                exit 1
              fi

              jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/jobs?per_page=100")
              failed_jobs=$(printf '%s' "$jobs" |
                jq '[.jobs[] | select(.status != "completed" or (.conclusion != "success" and .conclusion != "skipped"))] | length')
              required_jobs=$(printf '%s' "$jobs" |
                jq '[.jobs[] | select(.name == "lint-and-test" and .conclusion == "success")] | length')
              if [[ "$failed_jobs" != "0" || "$required_jobs" != "1" ]]; then
                echo "Exact-commit CI has failed or missing required jobs for $TARGET_SHA." >&2
                exit 1
              fi

              printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done

          echo "Timed out waiting for exact-commit CI for $TARGET_SHA." >&2
          exit 1

  create-release-tag:
    needs:
      - release-context
      - exact-commit-ci
    if: ${{ needs.release-context.outputs.manual == 'false' && needs.exact-commit-ci.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create immutable annotated release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
          TARGET_SHA: ${{ needs.release-context.outputs.target_sha }}
          LANDING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^neuralspotx-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "New releases must use the neuralspotx-v<version> tag format." >&2
            exit 1
          fi
          if [[ "$TARGET_SHA" != "$LANDING_SHA" ]]; then
            echo "Release tag target is not the reviewed release landing commit." >&2
            exit 1
          fi

          tag_object=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            --field "tag=$RELEASE_TAG" \
            --field "message=Release $RELEASE_TAG" \
            --field "object=$TARGET_SHA" \
            --field "type=commit")
          tag_object_sha=$(printf '%s' "$tag_object" | jq -r '.sha')
          if [[ ! "$tag_object_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub did not return an annotated tag object SHA." >&2
            exit 1
          fi

          # Creating a ref, rather than force-updating one, makes a reused tag
          # fail closed without moving or deleting any published tag.
          ref=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            --field "ref=refs/tags/$RELEASE_TAG" \
            --field "sha=$tag_object_sha")
          ref_type=$(printf '%s' "$ref" | jq -r '.object.type')
          ref_sha=$(printf '%s' "$ref" | jq -r '.object.sha')
          if [[ "$ref_type" != "tag" || "$ref_sha" != "$tag_object_sha" ]]; then
            echo "Created release ref is not an annotated tag object." >&2
            exit 1
          fi

          peeled_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$tag_object_sha" --jq '.object.sha')
          if [[ "$peeled_sha" != "$TARGET_SHA" ]]; then
            echo "Annotated tag does not peel to the reviewed landing commit." >&2
            exit 1
          fi

  build:
    needs:
      - release-context
      - exact-commit-ci
      - create-release-tag
    if: ${{ always() && needs.release-context.result == 'success' && needs.exact-commit-ci.result == 'success' && (needs.create-release-tag.result == 'success' || needs.create-release-tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-context.outputs.target_sha }}

      - name: Verify release tag still peels to CI target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.release-context.outputs.target_sha }}
        run: |
          set -euo pipefail
          tag_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$RELEASE_TAG")
          tag_type=$(printf '%s' "$tag_ref" | jq -r '.object.type')
          tag_object_sha=$(printf '%s' "$tag_ref" | jq -r '.object.sha')
          case "$tag_type" in
            tag)
              peeled_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$tag_object_sha" --jq '.object.sha')
              ;;
            commit)
              peeled_sha="$tag_object_sha"
              ;;
            *)
              echo "Release tag has unsupported object type: $tag_type" >&2
              exit 1
              ;;
          esac
          if [[ "$peeled_sha" != "$TARGET_SHA" ]]; then
            echo "Release tag no longer points to the CI-validated commit." >&2
            exit 1
          fi

      - name: Validate tag matches package version
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          tag = "${{ env.RELEASE_TAG }}"
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = data["project"]["version"]
          legacy_tag = f"v{version}"
          component_tag = f"neuralspotx-v{version}"
          if tag not in {legacy_tag, component_tag}:
              raise SystemExit(
                f"Release tag {tag} does not match pyproject.toml version {version}."
              )
          print(f"Validated release tag {tag} against package version {version}.")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: uv build

      - name: Validate distribution metadata
        run: uvx twine check dist/*

      - name: Smoke test installed wheel assets
        run: |
          wheel=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          if [[ -z "$wheel" ]]; then
            echo "No wheel found under dist/."
            exit 1
          fi

          smoke_venv="${RUNNER_TEMP}/nsx-wheel-smoke-venv"
          smoke_app="${RUNNER_TEMP}/nsx-wheel-smoke-app"
          smoke_module="${RUNNER_TEMP}/nsx-wheel-smoke-module"

          uv venv --python 3.11 "$smoke_venv"
          uv pip install --python "$smoke_venv/bin/python" "$wheel"

          "$smoke_venv/bin/nsx" create-app "$smoke_app" --no-bootstrap
          "$smoke_venv/bin/nsx" module init "$smoke_module" \
            --name nsx-wheel-smoke \
            --summary "Installed-wheel package-data smoke test."
          "$smoke_venv/bin/nsx" module validate "$smoke_module/nsx-module.yaml"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/*

  github-release:
    needs:
      - release-please
      - release-context
      - exact-commit-ci
      - create-release-tag
      - build
    if: ${{ always() && needs.release-context.result == 'success' && needs.exact-commit-ci.result == 'success' && needs.build.result == 'success' && (needs.create-release-tag.result == 'success' || needs.create-release-tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}

    steps:
      - name: Checkout the exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-context.outputs.target_sha }}

      - name: Verify release tag still peels to CI target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.release-context.outputs.target_sha }}
        run: |
          set -euo pipefail
          tag_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$RELEASE_TAG")
          tag_type=$(printf '%s' "$tag_ref" | jq -r '.object.type')
          tag_object_sha=$(printf '%s' "$tag_ref" | jq -r '.object.sha')
          if [[ "$tag_type" == "tag" ]]; then
            peeled_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$tag_object_sha" --jq '.object.sha')
          elif [[ "$tag_type" == "commit" ]]; then
            peeled_sha="$tag_object_sha"
          else
            echo "Release tag has unsupported object type: $tag_type" >&2
            exit 1
          fi
          if [[ "$peeled_sha" != "$TARGET_SHA" ]]; then
            echo "Release tag no longer points to the CI-validated commit." >&2
            exit 1
          fi

      - name: Derive release notes from the tagged changelog
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          tag = "${{ env.RELEASE_TAG }}"
          version = re.sub(r"^(?:neuralspotx-)?v", "", tag)
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(
              rf"^## \[{re.escape(version)}\].*$",
              re.MULTILINE,
          ).search(changelog)
          if heading is None:
              raise SystemExit(
                  f"CHANGELOG.md has no release section for {version}."
              )
          next_heading = re.compile(r"^## \[", re.MULTILINE).search(
              changelog,
              heading.end(),
          )
          body = changelog[
              heading.start() : next_heading.start() if next_heading else None
          ].strip()
          Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: dist

      - name: Create matching SHA256 manifest
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: dist/*

  pypi-publish:
    needs:
      - release-context
      - exact-commit-ci
      - create-release-tag
      - build
    if: ${{ always() && needs.release-context.result == 'success' && needs.exact-commit-ci.result == 'success' && needs.build.result == 'success' && (needs.create-release-tag.result == 'success' || needs.create-release-tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Verify release tag still peels to CI target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
          TARGET_SHA: ${{ needs.release-context.outputs.target_sha }}
        run: |
          set -euo pipefail
          tag_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$RELEASE_TAG")
          tag_type=$(printf '%s' "$tag_ref" | jq -r '.object.type')
          tag_object_sha=$(printf '%s' "$tag_ref" | jq -r '.object.sha')
          if [[ "$tag_type" == "tag" ]]; then
            peeled_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$tag_object_sha" --jq '.object.sha')
          elif [[ "$tag_type" == "commit" ]]; then
            peeled_sha="$tag_object_sha"
          else
            echo "Release tag has unsupported object type: $tag_type" >&2
            exit 1
          fi
          if [[ "$peeled_sha" != "$TARGET_SHA" ]]; then
            echo "Release tag no longer points to the CI-validated commit." >&2
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}

  finalize-release-please:
    needs:
      - release-context
      - create-release-tag
      - github-release
    if: ${{ always() && needs.github-release.result == 'success' && (needs.create-release-tag.result == 'success' || needs.create-release-tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Mark the exact merged release PR as tagged
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
          TARGET_SHA: ${{ needs.release-context.outputs.target_sha }}
          MANUAL: ${{ needs.release-context.outputs.manual }}
        run: |
          set -euo pipefail

          # `skip-github-release: true` keeps Release Please from performing
          # its normal `autorelease: pending` -> `autorelease: tagged` label
          # transition. The custom annotated-tag/GitHub-release path owns that
          # bookkeeping, but only after verifying the exact published release.
          tag_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$RELEASE_TAG")
          tag_type=$(printf '%s' "$tag_ref" | jq -r '.object.type')
          tag_object_sha=$(printf '%s' "$tag_ref" | jq -r '.object.sha')
          case "$tag_type" in
            tag)
              peeled_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$tag_object_sha" --jq '.object.sha')
              ;;
            commit)
              if [[ "$MANUAL" != "true" ]]; then
                echo "New release tag $RELEASE_TAG is not annotated." >&2
                exit 1
              fi
              peeled_sha="$tag_object_sha"
              ;;
            *)
              echo "Release tag has unsupported object type: $tag_type" >&2
              exit 1
              ;;
          esac
          if [[ "$peeled_sha" != "$TARGET_SHA" ]]; then
            echo "Release tag $RELEASE_TAG does not peel to $TARGET_SHA." >&2
            exit 1
          fi

          published_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$RELEASE_TAG" --jq '.tag_name')
          if [[ "$published_tag" != "$RELEASE_TAG" ]]; then
            echo "GitHub release does not match $RELEASE_TAG." >&2
            exit 1
          fi

          pulls=$(gh api "repos/${GITHUB_REPOSITORY}/commits/$TARGET_SHA/pulls")
          candidates=$(printf '%s' "$pulls" | jq \
            --arg sha "$TARGET_SHA" \
            '[.[] | select(
              .state == "closed"
              and .merged_at != null
              and .merge_commit_sha == $sha
              and .base.ref == "main"
            )]')
          count=$(printf '%s' "$candidates" | jq 'length')
          if [[ "$count" != "1" ]]; then
            if [[ "$MANUAL" == "true" ]]; then
              echo "Manual rebuild has no unique merged release PR for $TARGET_SHA; no lifecycle label to reconcile."
              exit 0
            fi
            echo "Expected one merged release PR for $TARGET_SHA, found $count." >&2
            exit 1
          fi
          number=$(printf '%s' "$candidates" | jq -r '.[0].number')

          labels=$(gh api "repos/${GITHUB_REPOSITORY}/issues/$number/labels" --jq '[.[].name]')
          has_pending=$(printf '%s' "$labels" | jq 'index("autorelease: pending") != null')
          has_tagged=$(printf '%s' "$labels" | jq 'index("autorelease: tagged") != null')

          if [[ "$has_pending" != "true" && "$has_tagged" == "true" ]]; then
            echo "Release PR #$number is already marked autorelease: tagged."
            exit 0
          fi
          if [[ "$has_pending" != "true" ]]; then
            if [[ "$MANUAL" == "true" ]]; then
              echo "Manual rebuild PR #$number has no Release Please lifecycle label; nothing to reconcile."
              exit 0
            fi
            echo "Release PR #$number has neither the expected pending state nor an idempotent tagged state." >&2
            exit 1
          fi

          # Add the completed state before removing pending. If the second call
          # fails, Release Please remains safely blocked until this job is
          # retried rather than silently losing all lifecycle state.
          printf '%s\n' '{"labels":["autorelease: tagged"]}' |
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/$number/labels" --input - >/dev/null
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/issues/$number/labels/autorelease%3A%20pending" >/dev/null

          final_labels=$(gh api "repos/${GITHUB_REPOSITORY}/issues/$number/labels" --jq '[.[].name]')
          if [[ "$(printf '%s' "$final_labels" | jq 'index("autorelease: pending") == null')" != "true" ||
                "$(printf '%s' "$final_labels" | jq 'index("autorelease: tagged") != null')" != "true" ]]; then
            echo "Release Please labels did not converge for PR #$number." >&2
            exit 1
          fi
