schema_version: 1

module:
  name: nsx-board-corstone310-fvp-u55
  type: board
  version: "0.1.0"

licenses:
  .: BSD-3-Clause

support:
  ambiqsuite: false
  corstone: true
  zephyr: false

build:
  cmake:
    package: nsx_board_corstone310_fvp_u55
    targets:
      - nsx::board_corstone310_fvp_u55

depends:
  required:
    - nsx-corstone-soc
    - role: bsp
      contracts: [2]
  optional: []

constraints:
  required_sdk_provider: nsx-corstone-sdk

compatibility:
  boards:
    - corstone310_fvp_u55
  socs:
    - corstone310
  toolchains:
    - arm-none-eabi-gcc
