schema_version: 1

channels:
  stable:
    default: true
  preview: {}

projects:
  neuralspotx:
    name: neuralspotx
    url: https://github.com/AmbiqAI/neuralspotx.git
    # atomiq110 board content only exists on this branch. Pin here until it
    # merges to main, then restore the main pin.
    revision: fix/atomiq110-dso-handle
    path: neuralspotx
  # Unified SDK: one repo covering all supported SoC families. The v5.2.24
  # pin predates atomiq110; atomiq110 support (nsx-ambiq-sdk PR #46) rides
  # the feat/nsx-power-atomiq110 pins below until that PR merges and a new
  # tag exists.
  nsx-ambiq-sdk:
    name: nsx-ambiq-sdk
    url: https://github.com/AmbiqAI/nsx-ambiq-sdk.git
    revision: v5.2.24
    path: modules/nsx-ambiq-sdk
  nsx-pmu-armv8m:
    name: nsx-pmu-armv8m
    url: https://github.com/AmbiqAI/nsx-pmu-armv8m.git
    revision: v0.2.0
    path: modules/nsx-pmu-armv8m
  nsx-nanopb:
    name: nsx-nanopb
    url: https://github.com/AmbiqAI/nsx-nanopb.git
    revision: v0.1.1
    path: modules/nsx-nanopb
  ns-cmsis-nn:
    name: ns-cmsis-nn
    url: https://github.com/AmbiqAI/ns-cmsis-nn.git
    # v7.29.2 — fix/atomiq110-compat merged upstream (wildcard board/SoC
    # compatibility + requantize fix). Tag pin per registry policy.
    revision: v7.29.2
    path: modules/ns-cmsis-nn
  helia-dsp:
    name: helia-dsp
    url: https://github.com/AmbiqAI/helia-dsp.git
    revision: v1.0.0
    path: modules/helia-dsp
  nsx-ethos-u-driver:
    name: nsx-ethos-u-driver
    url: https://github.com/AmbiqAI/nsx-ethos-u-driver.git
    revision: nsx-ethos-u-driver-v0.1.2
    path: modules/nsx-ethos-u-driver
  helia-rt:
    name: helia-rt
    url: https://github.com/AmbiqAI/helia-rt.git
    # Ethos-U wrapper plumbing + atomiq110 compatibility are still landing on
    # helia-rt's open fix/atomiq110-compat branch. Pin there until the branch
    # merges and a release tag (> v1.16.0) exists, then pin the tag.
    revision: fix/atomiq110-compat
    path: modules/helia-rt
  helia-rt-source:
    name: helia-rt-source
    url: https://github.com/AmbiqAI/helia-rt.git
    revision: 7c1b162c0fd2336876b69daaa20c87a1e7e2f508
    path: modules/helia-rt-source
  arm-cmsis-nn:
    name: arm-cmsis-nn
    url: https://github.com/AmbiqAI/arm-cmsis-nn.git
    revision: v0.1.0
    path: modules/arm-cmsis-nn
  nsx-tflite-micro:
